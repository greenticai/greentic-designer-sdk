[workspace]
resolver = "2"
members = [
    "crates/greentic-extension-sdk-contract",
    "crates/greentic-extension-sdk-state",
    "crates/greentic-extension-sdk-registry",
    "crates/greentic-extension-sdk-testing",
    "crates/greentic-extension-sdk-cli",
]

[workspace.package]
edition = "2024"
version = "1.2.23"
license = "MIT"
repository = "https://github.com/greenticai/greentic-designer-sdk"
rust-version = "1.95"

[workspace.dependencies]
# A RANGE, not an `=` pin, and deliberately the same range greentic-runner-host
# declares (`>=1.2.0-dev, <1.3.0-0`) so this crate adds no new constraint to a
# consumer's resolution.
#
# It was `=1.3.0-research.1`, which was a workspace lane pin rather than a
# requirement: this workspace touches greentic-types in exactly three places —
# two `use greentic_types::secrets::SecretRequirement;` lines in the contract
# (describe/mod.rs:1, describe/contributions/tool.rs:5) for a serde-transparent,
# `#[non_exhaustive]` field type that is never constructed, plus the CLI's pack
# manifest codec. `src/secrets.rs` is byte-identical across 1.2.0-dev.30553518006,
# 1.3.0-research.1 and 1.3.0-research.2, and the pin oscillated BACKWARDS across
# releases (1.1.3 -> 1.1.4 went `=1.2.0-research.1` -> `=1.1.2`) while the same
# two use-lines stood — which a semantic requirement cannot do.
#
# The `=` pin was load-bearing in the wrong direction: it forced every consumer
# of this crate onto the 1.3 types line, which the crates.io runner lane cannot
# admit, so no published sdk-contract carrying `capabilities` was installable
# there and deployed runners loaded zero design extensions.
#
# `<1.4.0-0` was measured and rejected: cargo only lets a prerelease satisfy a
# comparator carrying a prerelease on the SAME major.minor.patch, so `<1.4.0-0`
# admits no 1.3.0-research.* either and resolves identically today, while
# widening the CLI's exposure to a future stable 1.3 codec change for nothing.
greentic-types = { version = ">=1.2.0-dev, <1.3.0-0", default-features = false, features = ["std", "serde"] }
anstyle = "1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
ciborium = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
constant_time_eq = "0.3"
dialoguer = "0.11"
directories = "5"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
fs2 = "0.4"
include_dir = "0.7"
jsonschema = "0.30"
notify-debouncer-full = "0.4"
oci-client = { version = "0.14", default-features = false, features = ["rustls-tls"] }
once_cell = "1"
pkcs8 = { version = "0.10", features = ["pem"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
which = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
