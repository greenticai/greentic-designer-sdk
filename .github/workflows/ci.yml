name: CI

on:
  push:
    branches: [main, develop, research]
  pull_request:
    branches: [main, develop, research]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features --locked

      - name: cargo build (release)
        run: cargo build --workspace --locked --release

      # Only contract+state can be dry-run pre-release: testing/registry/cli
      # depend on them via path+version, and cargo publish resolves those deps
      # against crates.io where the unreleased -research versions don't exist.
      # Their publishability is verified at release time by release.yml's ordered
      # publish (audit cycle-2 N13).
      - name: cargo publish dry-run (leaf crates)
        run: |
          cargo publish --dry-run --allow-dirty -p greentic-extension-sdk-contract
          cargo publish --dry-run --allow-dirty -p greentic-extension-sdk-state
