name: CI

on:
  push:
    branches: [main, develop, research]
  pull_request:
    # Research release branches (`chore/bump-research-*`) were not matched, so
    # PRs targeting them ran no fmt/clippy/test at all — only the smoke job.
    branches: [main, develop, research, "chore/bump-*", "release/**"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features --locked

      - name: cargo build (release)
        run: cargo build --workspace --locked --release

      # Only contract+state can be dry-run pre-release: testing/registry/cli
      # depend on them via path+version, and cargo publish resolves those deps
      # against crates.io where the unreleased -research versions don't exist.
      # Their publishability is verified at release time by release.yml's ordered
      # publish (audit cycle-2 N13).
      - name: cargo publish dry-run (leaf crates)
        run: |
          cargo publish --dry-run --allow-dirty -p greentic-extension-sdk-contract
          cargo publish --dry-run --allow-dirty -p greentic-extension-sdk-state

  scaffold-compiles:
    name: scaffolds compile (cargo component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      # Install the targets for the toolchain the *scaffolds* pin
      # (rust-toolchain.toml in every generated project), not just the default
      # one — otherwise the first test to build fetches them mid-run, and the
      # parallel tests then race each other's rustup installs.
      - name: Add wasm targets
        run: |
          rustup target add wasm32-wasip2 wasm32-wasip1
          rustup target add --toolchain 1.95.0 wasm32-wasip2 wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-component
        run: cargo install cargo-component --locked

      - name: Build gtdx
        run: cargo build -p greentic-extension-sdk-cli --locked

      # The suite's compile smoke tests are #[ignore]d: they need
      # cargo-component, the wasm32-wasip2 target, and network for dependency
      # resolution, so they cannot run in the default `cargo test`. Without this
      # job they never run at all — which is how six of seven `gtdx new` kinds
      # shipped unable to build while CI stayed green.
      # Single-threaded: each of these tests shells out to cargo/rustup, and in
      # parallel they contend for the same toolchain state. They are slow
      # cargo builds either way, so serializing costs little and makes a
      # failure readable.
      - name: cargo test -- --ignored
        run: cargo test -p greentic-extension-sdk-cli --locked -- --ignored --test-threads=1

  audit:
    name: cargo deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
