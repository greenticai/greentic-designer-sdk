name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-binaries:
    name: Build gtdx binaries (6 platforms)
    # Skip pre-release / channel tags (v*-dev, v*-research). These come from
    # auto-tag-channel.yml on develop/research pushes and are not meant to
    # trigger a crates.io publish — Cargo.toml at the workspace stays on the
    # stable base version. Stable v<X.Y.Z> tags still fire.
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    uses: greenticai/.github/.github/workflows/release-binaries.yml@main
    with:
      package: greentic-extension-sdk-cli
      binary: gtdx
      windows-archive-format: zip
    secrets: inherit

  publish-crates:
    name: Publish to crates.io
    needs: [release-binaries]
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    permissions:
      contents: read
    uses: greenticai/.github/.github/workflows/crates-publish.yml@main
    with:
      # Order matters: testing is a dev-dep of registry + cli, so it must be
      # published before them or the verification step can't resolve it from
      # crates.io.
      crates: "greentic-extension-sdk-contract greentic-extension-sdk-state greentic-extension-sdk-testing greentic-extension-sdk-registry greentic-extension-sdk-cli"
    secrets: inherit
