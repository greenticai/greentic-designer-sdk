name: "Validate Greentic Extension"
description: "Run gtdx lint (governance rules) against an extension's describe.json"
inputs:
  dir:
    description: "Extension directory containing describe.json"
    required: false
    default: "."
  gtdx-git:
    description: "Git URL of the SDK CLI to install gtdx from"
    required: false
    default: "https://github.com/greenticai/greentic-designer-sdk"
  gtdx-ref:
    description: "Git ref (tag/branch) to install gtdx from"
    required: true
  publish:
    description: "Also enforce publish-only rules (E_SHA256_ZERO). Off by default because committed describe.json carry placeholder hashes that the build fills at publish time."
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Install gtdx
      shell: bash
      run: |
        cargo install --locked \
          --git "${{ inputs.gtdx-git }}" \
          --tag "${{ inputs.gtdx-ref }}" \
          greentic-extension-sdk-cli
    - name: Lint extension
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        DIR: ${{ inputs.dir }}
      run: |
        FLAG=""
        [ "$PUBLISH" = "true" ] && FLAG="--publish"
        gtdx lint $FLAG --dir "$DIR"
